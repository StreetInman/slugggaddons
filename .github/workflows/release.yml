name: Release

# Push a tag like v0.2.0, or push to the `release` branch, to build a jar for every supported
# Minecraft version, attach them all to one GitHub release (tagged v<mod_version>), and upload
# each to Modrinth (only if the MODRINTH_TOKEN secret is set).
on:
  push:
    tags: ['v*']
    branches: [release]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mc: ['26.1.2', '26.2', '26.3']
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build -Pmc=${{ matrix.mc }}
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.mc }}
          path: fabric/build/libs/slugggaddons-*[0-9].jar
      - name: Publish to Modrinth
        if: ${{ env.MODRINTH_TOKEN != '' }}
        run: ./gradlew :fabric:publishMods -Pmc=${{ matrix.mc }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out the tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          fi
      - name: Point the tag at this commit
        # Re-releasing the same version (a hotfix) replaces its jars, so move the tag along with them.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          git tag -f "${{ steps.tag.outputs.name }}" "$GITHUB_SHA"
          git push -f origin "refs/tags/${{ steps.tag.outputs.name }}"
      - uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: '*.jar'
          generate_release_notes: true
          overwrite_files: true
