name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: set -o pipefail; ./gradlew build -Pmc=${{ matrix.mc }} --stacktrace 2>&1 | tee build.log
      - name: Report compile errors
        if: failure()
        # Turn each javac error (with its symbol/location lines) into one annotation, so it shows
        # on the run page without opening the full log.
        run: |
          grep -A4 ': error:' build.log | awk 'BEGIN{RS="--\n"} {gsub(/\n/, "%0A"); print "::error title=javac " "${{ matrix.mc }}" "::" $0}' | head -50
      - name: Show Minecraft API for version differences
        if: always()
        run: |
          jar=$(find ~/.gradle/caches/fabric-loom -name 'minecraft-merged.jar' -path '*/${{ matrix.mc }}/*' 2>/dev/null | head -1)
          [ -n "$jar" ] || { echo "::notice title=api probe ${{ matrix.mc }}::no merged jar"; exit 0; }
          grep -v '^#' .github/api-probe.txt | while read -r c pattern; do
            [ -n "$c" ] || continue
            if [ "$c" = "find" ]; then
              out=$(unzip -Z1 "$jar" | grep -E "$pattern" | grep -v '\$' | head -40 | tr '\n' '|')
              echo "::notice title=find $pattern ${{ matrix.mc }}::$out"
              continue
            fi
            fapi=$(find ~/.gradle/caches .gradle -name 'fabric-*.jar' -not -name '*sources*' 2>/dev/null | tr '\n' ':')
            if [ "$c" = "fapifind" ]; then
              out=$(for f in $(echo "$fapi" | tr ':' ' '); do unzip -Z1 "$f" 2>/dev/null; done | grep -E "$pattern" | sort -u | head -40 | tr '\n' '|')
              echo "::notice title=fapifind $pattern ${{ matrix.mc }}::$out"
              continue
            fi
            cp="$jar:$fapi$(find ~/.gradle/caches/modules-2 -name 'authlib-*.jar' -not -name '*sources*' 2>/dev/null | sort -V | tr '\n' ':')"
            out=$(javap -p -cp "$cp" "$c" 2>&1 | grep -E "$pattern" | grep -v 'lambda\$' | sed -e 's/^ *//' -e 's/net\.minecraft\.//g' -e 's/com\.mojang\.//g' | tr '\n' '|' | sed 's/%/%25/g')
            echo "::notice title=$c ${{ matrix.mc }}::$out"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: slugggaddons-mc${{ matrix.mc }}
          path: fabric/build/libs/slugggaddons-*[0-9].jar

  # Starts the game once per version under a virtual display to make sure every mixin applies.
  # Mixin targets are only checked at runtime, so a green compile alone can still crash on launch.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 libegl1 mesa-vulkan-drivers libvulkan1 > /dev/null
      - name: Launch the client
        run: |
          mkdir -p fabric/run
          echo "eula=true" > fabric/run/eula.txt
          # A 1280x720 window at GUI scale 2 is wide enough for the /pv player model column.
          echo "guiScale:2" > fabric/run/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEODRIVER=x11 SKYBLOCKPV_SELFTEST=1
          (timeout 900 xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" ./gradlew :fabric:runClient -Pmc=${{ matrix.mc }} --args="--width 1280 --height 720" \
            -Dmixin.debug.verify=true > client.log 2>&1 || true)
          # The self-test opens /pv with sample data, every tab, the item browser and the settings.
          grep -E "SKYBLOCKPV SELFTEST" client.log | grep -v " tick [0-9]* screen" | head -30 | cut -c1-300 | sed 's/^/::notice title=selftest ${{ matrix.mc }}::/'
          if grep -qE "Mixin apply.*failed|InvalidInjectionException|InvalidMixinException|Game crashed|Could not execute entrypoint|Incompatible mods" client.log; then
            grep -E -A30 "Mixin apply.*failed|InvalidInjection|InvalidMixin|Game crashed|Could not execute entrypoint|Incompatible mods|Minecraft Crash Report" client.log | grep -v flite | cut -c1-300 | head -80 | awk '{printf "%s%%0A", $0}' | sed 's/^/::error title=launch ${{ matrix.mc }}::/'
            echo
            exit 1
          fi
          if ! grep -q "SKYBLOCKPV SELFTEST PASSED" client.log; then
            grep -E -A40 "SELFTEST (STALL|FAILED)" client.log | head -60 | awk '{printf "%s%%0A", $0}' | sed 's/^/::error title=selftest ${{ matrix.mc }}::/'
            echo
            grep -E "SELFTEST|Exception in|Caused by" client.log | grep -v flite | cut -c1-300 | tail -15 | awk '{printf "%s%%0A", $0}' | sed 's/^/::error title=selftest tail ${{ matrix.mc }}::/'
            echo
            exit 1
          fi
          if grep -qE "Created: .*textures/atlas|Sound engine started|Loaded [0-9]+ recipes|Narrator library" client.log; then
            echo "::notice title=launch ${{ matrix.mc }}::Client started with skyblockpv mixins applied"
          else
            tail -40 client.log | awk '{printf "%s%%0A", $0}' | sed 's/^/::warning title=launch ${{ matrix.mc }} (no start marker)::/'
            echo
          fi
