org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true

# Fabric (https://fabricmc.net/develop). Minecraft 26.x is unobfuscated, so no mappings are needed.
# The Minecraft and Fabric API versions live in versions/<mc>.properties; pick one with -Pmc=26.1.2.
default_mc=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Libraries
gson_version=2.13.1
junit_version=5.12.2
# https://github.com/AzureAaron/legacy-item-dfu. Plain Java with no Minecraft dependency, so the
# same build works on every 26.x version we target.
legacy_item_dfu_version=1.0.4+26.2

# Publishing (https://github.com/modmuss50/mod-publish-plugin)
mod_publish_plugin_version=2.1.1
# Fill in once the Modrinth project exists.
modrinth_id=

# Mod
mod_version=0.4.0
maven_group=io.github.streetinman
archives_base_name=slugggaddons
